name: Vita Plan v2 Validate and Deploy

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/deploy.yml'
      - name: Validate score bundle freshness
        run: python3 scripts/generate_v2_manifest.py --check
      - name: Validate score data / manifest / assets
        run: python3 scripts/check_scores.py
      - name: Validate trimmed soundfont range
        run: python3 scripts/check_soundfont_range.py
      - name: Validate AGENTS.md indicator-only
        run: python3 scripts/check_agents.py
      - name: JS syntax
        run: |
          for f in assets/js/v2-ui.js assets/js/v2-cache.js assets/js/score-format.js assets/js/script.js assets/player/*.js sw-v2.js admin/admin.js; do
            node --check "$f"
          done
      - name: Score bundle round-trip
        run: node tests/score_bundle_test.js
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('.github/workflows/deploy.yml') }}
      - name: Install Playwright
        run: |
          python3 -m pip install --quiet playwright==1.62.0
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python3 -m playwright install chromium
            # Runner image may lack a system lib; fall back to installing deps only then.
            if ! python3 -c "from playwright.sync_api import sync_playwright; s=sync_playwright().start(); s.chromium.launch(args=['--no-sandbox']).close(); s.stop()"; then
              python3 -m playwright install --with-deps chromium
            fi
          else
            python3 -m playwright install --with-deps chromium
          fi
      - name: Browser UI checks
        run: |
          python3 tests/serve.py 8080 &
          for _ in $(seq 1 50); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 0.2
          done
          python3 tests/ui_check.py http://127.0.0.1:8080/

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/vita-plan-v2
            git pull origin main
            chown -R www-data:www-data .
            bash scripts/deploy-edge.sh
