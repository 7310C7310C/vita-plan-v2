<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vita Plan</title>
<link rel="stylesheet" href="assets/player/player.css?v=1">
</head>
<body>

<div class="toolbar" id="toolbar">
  <div class="toolbar-inner">
    <div class="tb-row">
      <button id="playBtn" class="primary icon-only big" aria-label="播放" title="播放／暂停"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.5-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/></svg></button>
      <button id="stopBtn" class="icon-only big" aria-label="停止" title="停止"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.6"/></svg></button>
      <span class="selinfo" id="selInfo"></span>
      <button id="clearSel" style="display:none">取消选择</button>
      <span class="spacer"></span>
      <span class="loadinfo" id="loadInfo"></span>
      <button id="tbToggle" class="icon-only" aria-expanded="true" title="收合设定" aria-label="收合设定">▴</button>
      <button id="menuBtn" class="icon-only" aria-label="更多设定" title="设定"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>

    <div class="tb-more" id="tbMore">
      <div class="fields">
        <div class="field">
          <span class="flabel">声部</span>
          <div class="fbody">
            <button class="chip" data-part="S" title="女高音">S</button>
            <button class="chip" data-part="A" title="女低音">A</button>
            <button class="chip" data-part="T" title="男高音">T</button>
            <button class="chip" data-part="B" title="男低音">B</button>
            <button id="partsAll" class="icon-only" title="全部声部" aria-label="全部声部">全</button>
          </div>
        </div>
        <div class="field">
          <span class="flabel">速度</span>
          <div class="fbody">
            <input type="range" id="tempo" min="30" max="220" step="1" value="80" aria-label="速度">
            <span class="val" id="tempoVal">80</span>
          </div>
        </div>
        <div class="field">
          <span class="flabel">节拍</span>
          <div class="fbody">
            <button id="metroBtn" class="icon-only" aria-pressed="false" title="节拍器" aria-label="节拍器"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M9.5 3h5L19 21H5L9.5 3z"/><path d="M12 14l4.5-5.5"/></svg></button>
          </div>
        </div>
        <div class="field">
          <span class="flabel">音量</span>
          <div class="fbody"><input type="range" id="vol" min="0" max="100" value="100" aria-label="音量"></div>
        </div>
        <div class="field grow">
          <span class="flabel">音色</span>
          <div class="fbody">
            <select id="timbre" aria-label="音色"></select>
          </div>
        </div>
        <div class="field">
          <span class="flabel">歌词</span>
          <div class="fbody">
            <select id="lyricFont" aria-label="歌词字体">
              <option value="serif">宋体</option>
              <option value="hei">正黑</option>
              <option value="yahei">雅黑</option>
              <option value="kai">楷体</option>
              <option value="round">圆体</option>
            </select>
            <button id="boldBtn" class="icon-only" title="歌词加粗" aria-label="歌词加粗" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5h6.2a4 4 0 0 1 0 8H7z"/><path d="M7 13h7a4 4 0 0 1 0 8H7z"/></svg></button>
          </div>
        </div>
        <div class="field">
          <span class="flabel">字号</span>
          <div class="fbody">
            <input type="range" id="scale" min="80" max="150" step="5" value="100" aria-label="乐谱字号">
            <span class="val" id="scaleVal">100%</span>
          </div>
        </div>
        <div class="field">
          <span class="flabel">检视</span>
          <div class="fbody">
            <button id="wrapBtn" class="on" title="依视窗宽度自动换行">自动换行</button>
            <button id="followBtn" class="on" aria-pressed="true" title="跟随播放">跟随播放</button>
            <button id="themeBtn" class="icon-only" title="切换日夜" aria-label="切换日夜"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
            <button id="langBtn" title="简繁切换">简</button>
          </div>
        </div>
        <div class="field">
          <span class="flabel">设定</span>
          <div class="fbody"><button id="resetAll" title="回复预设">重置</button></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="sheet-backdrop" id="sheetBackdrop"></div>

<div class="wrap">
  <a class="back" href="./">← 曲目</a>
  <header>
    <h1></h1>
    <div class="meta-original"></div>
    <div class="meta-credit"></div>
  </header>
  <div class="score-head"><span class="kt">1=G</span><span class="kt">6/8</span></div>
  <div class="score-tempo" id="scoreTempo"></div>
  <div class="score-capo" id="scoreCapo"></div>
  <div class="score-wrap" id="scoreWrap">
    <div class="score" id="score"></div>
    <div class="annot-layer" id="annotLayer"></div>
  </div>
</div>

<div class="chord-pop" id="chordPop" aria-hidden="true">
  <div class="chord-pop-head"><b id="chordPopTitle"></b><button id="chordPopClose" type="button" aria-label="关闭">×</button></div>
  <div class="chord-pop-body" id="chordPopBody"></div>
</div>
<div class="toast" id="toast"></div>
<div class="global-loading" id="globalLoading" aria-hidden="true"><span class="spinner"></span><span class="gl-text">转换中…</span></div>

<script src="assets/player/player-boot.js?v=1"></script>
<script src="assets/player/player-main.js?v=1"></script>
<script src="assets/player/player-chords.js?v=1"></script>
</body>
</html>
